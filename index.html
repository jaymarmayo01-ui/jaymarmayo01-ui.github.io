<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px 10px 24px;-webkit-user-select:none;user-select:none}

<body>
<h1>Trust No Cheese</h1>
<p>Reach the cheese wheel in each level. Move with the arrow keys or the buttons, jump with Space. Everything else is a trap.</p>
<canvas id="c" aria-label="Trust No Cheese game"></canvas>
<div class="pad">
<button data-k="l" aria-label="Move left">&#9664;</button>
<button data-k="r" aria-label="Move right">&#9654;</button>
<button data-k="j" class="j" aria-label="Jump">JUMP</button>
</div>
<script>
(function(){
var W=720,H=360,T=40,PW=24;
var c=document.getElementById('c'),ctx=c.getContext('2d');
var dpr=Math.min(2,window.devicePixelRatio||1);
c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
var LV=[
{n:"Totally safe",w:44,o:[['P',6,7],['F',10,7,2],['.',10,8,2],['.',16,7,3],['.',16,8,3],['S',22,7],['D',26,2],['S',30,7],['M',30,3],['C',35,6],['E',39,6],['G',42,6]]},
{n:"Still safe",w:52,o:[['D',8,2],['D',9,2],['P',14,7],['P',17,7],['P',20,7],['F',25,7,3],['.',25,8,3],['.',29,7,3],['.',29,8,3],['#',33,5,3],['E',36,6],['S',39,7],['M',39,3],['C',43,6],['D',46,2],['F',48,7],['.',48,8],['G',51,6]]},
{n:"Okay, now it is mean",w:60,o:[['P',6,7],['E',12,6],['F',16,7,2],['.',16,8,2],['P',21,7],['D',24,2],['D',25,2],['C',28,6],['.',31,7,3],['.',31,8,3],['#',34,5,2],['D',37,2],['S',40,7],['M',40,3],['P',44,7],['F',47,7,2],['.',47,8,2],['E',51,6],['P',54,7],['D',56,2],['C',57,6],['G',59,6]]},
{n:"Wait for it",w:58,o:[['Q',8,7],['F',14,7,2],['.',14,8,2],['U',20,2],['P',24,7],['Y',27,6],['.',32,7,3],['.',32,8,3],['E',37,6],['Q',40,7],['D',46,2],['C',49,6],['U',52,2],['G',55,6]]},
{n:"Spike snails",w:64,o:[['Y',12,6],['P',17,7],['F',21,7,2],['.',21,8,2],['Y',27,6],['D',31,2],['D',32,2],['C',35,6],['.',38,7,3],['.',38,8,3],['#',42,5,2],['Q',45,7],['E',50,6],['U',54,2],['S',56,7],['M',56,3],['Y',59,6],['G',62,6]]},
{n:"Everything at once",w:70,o:[['Q',6,7],['Q',12,7],['E',17,6],['F',20,7,2],['.',20,8,2],['U',26,2],['U',27,2],['Y',30,6],['P',34,7],['.',38,7,3],['.',38,8,3],['#',42,5,2],['D',45,2],['D',46,2],['C',49,6],['Q',52,7],['S',57,7],['M',57,3],['E',60,6],['Y',62,6],['U',65,2],['C',67,6],['G',69,6]]},
{n:"Deja vu",w:66,o:[['P',7,7],['Q',12,7],['F',19,7,2],['.',19,8,2],['Y',24,6],['.',29,7,3],['.',29,8,3],['D',34,2],['D',35,2],['E',38,6],['P',41,7],['Q',44,7],['S',51,7],['M',51,3],['U',55,2],['C',58,6],['Y',60,6],['G',65,6]]},
{n:"Moving day",w:70,o:[['U',8,2],['P',13,7],['U',17,2],['U',18,2],['F',23,7,2],['.',23,8,2],['Y',28,6],['.',33,7,3],['.',33,8,3],['#',37,5,2],['Q',40,7],['D',46,2],['E',49,6],['U',52,2],['P',56,7],['S',59,7],['M',59,3],['Y',62,6],['C',65,6],['G',69,6]]},
{n:"Trust nothing",w:74,o:[['E',10,6],['Q',14,7],['F',20,7,2],['.',20,8,2],['P',25,7],['Y',29,6],['D',33,2],['D',34,2],['.',38,7,3],['.',38,8,3],['#',42,5,2],['C',46,6],['Q',49,7],['U',56,2],['U',57,2],['S',60,7],['M',60,3],['E',64,6],['P',67,7],['Y',69,6],['C',71,6],['G',73,6]]},
{n:"The last cheese",w:80,o:[['Q',6,7],['Q',12,7],['P',19,7],['F',23,7,2],['.',23,8,2],['Y',28,6],['Y',31,6],['.',36,7,3],['.',36,8,3],['#',40,5,2],['D',44,2],['D',45,2],['E',48,6],['Q',51,7],['U',58,2],['S',62,7],['M',62,3],['C',65,6],['Y',70,6],['P',73,7],['C',77,6],['G',79,6]]}
];
var MSG={spike:["Spikes are not a rest stop.","Ouch. That one was obvious."],pop:["The floor had a surprise for you.","Surprise spikes! Everyone loves those."],block:["Look up next time.","The sky is falling. Just that one block."],cheese:["Did you really trust that cheese?","Free cheese is never free."],exit:["That was not the exit.","Nice try. The real one is further."],pit:["The floor was a lie.","Gravity says hello."]};
var keys={l:0,r:0,j:0};
var st='title',lv=0,deaths=0,g,LW,ents,p,rev,act,fl,cam=0,t=0,msg='',dT=0,intro=0,AC=null;
function beep(f,d,ty){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain();o.type=ty||'square';o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function load(i){
 var L=LV[i];LW=L.w;g=[];ents=[];rev={};act={};fl=[];
 for(var r=0;r<9;r++){g.push(new Array(LW).fill(r>=7?'#':'.'))}
 L.o.forEach(function(o){var n=o[3]||1;for(var k=0;k<n;k++){if('DUYQ'.indexOf(o[0])>=0)ents.push({k:o[0],x:(o[1]+k)*T,y:o[2]*T,y0:o[2]*T,vy:0,s:0,t:0});else g[o[2]][o[1]+k]=o[0]}});
 p={x:2*T+8,y:7*T-PW,vx:0,vy:0,f:1,on:false};intro=1.6;
}
function start(){if(st==='title'||st==='win'){if(st==='win'){deaths=0;lv=0}load(lv);st='play'}}
function pressJ(){if(st!=='play')start()}
window.addEventListener('keydown',function(e){
 var k=e.code;
 if(k==='ArrowLeft'||k==='KeyA')keys.l=1;else if(k==='ArrowRight'||k==='KeyD')keys.r=1;
 else if(k==='Space'||k==='ArrowUp'||k==='KeyW'){keys.j=1;pressJ()}else return;
 e.preventDefault();
});
window.addEventListener('keyup',function(e){var k=e.code;
 if(k==='ArrowLeft'||k==='KeyA')keys.l=0;else if(k==='ArrowRight'||k==='KeyD')keys.r=0;
 else if(k==='Space'||k==='ArrowUp'||k==='KeyW')keys.j=0;});
Array.prototype.forEach.call(document.querySelectorAll('.pad button'),function(b){
 var k=b.getAttribute('data-k');
 b.addEventListener('pointerdown',function(e){e.preventDefault();keys[k]=1;if(k==='j')pressJ()});
 ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,function(){keys[k]=0})});
});
c.addEventListener('pointerdown',function(e){e.preventDefault();pressJ()});
function solid(x,y){if(x<0||x>=LW)return true;if(y<0||y>=9)return false;var h=g[y][x];return h==='#'||h==='P'||h==='F'||h==='M'}
function hit(x,y){
 for(var tx=Math.floor(x/T);tx<=Math.floor((x+PW-.1)/T);tx++)for(var ty=Math.floor(y/T);ty<=Math.floor((y+PW-.1)/T);ty++){
  if(solid(tx,ty)){if(ty>=0&&ty<9&&g[ty][tx]==='M')rev[tx+','+ty]=1;return{tx:tx,ty:ty}}
 }
 return null;
}
function ov(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function kill(k){
 if(st!=='play')return;
 st='dead';dT=1;deaths++;var a=MSG[k];msg=a[Math.floor(Math.random()*a.length)];beep(150,.4,'sawtooth');
}
function crawl(e,dt,cx){
 if(e.s===2){e.y+=600*dt;return}
 if(!e.s&&Math.abs(cx-(e.x+20))<220)e.s=1;
 if(e.s===1){e.x+=(cx>e.x+20?1:-1)*130*dt;if(!solid(Math.floor((e.x+20)/T),7))e.s=2}
 if(ov(p.x,p.y,PW,PW,e.x+6,e.y+14,28,26))kill('spike');
}
function dpop(e,dt,cx){
 var c0=e.x+20;
 if(e.s===0&&Math.abs(cx-c0)<48)e.s=1;
 if(e.s===1){if(ov(p.x,p.y,PW,PW,e.x+8,e.y-28,24,28))kill('pop');if(cx>c0+24){e.s=2;e.t=.3}}
 else if(e.s===2){e.t-=dt;if(e.t<=0){e.s=3;e.t=.25;e.x2=Math.floor((cx+70)/T)*T}}
 else if(e.s===3){e.t-=dt;if(e.t<=0&&ov(p.x,p.y,PW,PW,e.x2+8,e.y-28,24,28))kill('pop');if(e.t<-1.2)e.s=4}
}
function update(dt){
 t+=dt;if(intro>0)intro-=dt;
 var d=keys.r-keys.l;p.vx=d*220;if(d)p.f=d;
 if(keys.j&&p.on){p.vy=-760;p.on=false;beep(440,.08)}
 if(!keys.j&&p.vy<-300)p.vy=-300;
 p.vy=Math.min(1100,p.vy+2200*dt);
 p.x+=p.vx*dt;var h=hit(p.x,p.y);
 if(h){if(p.vx>0)p.x=h.tx*T-PW;else if(p.vx<0)p.x=(h.tx+1)*T}
 p.y+=p.vy*dt;p.on=false;h=hit(p.x,p.y);
 if(h){if(p.vy>0){p.y=h.ty*T-PW;p.on=true}else p.y=(h.ty+1)*T;p.vy=0}
 if(p.on){
  var row=Math.floor((p.y+PW+1)/T);
  for(var tx=Math.floor(p.x/T);tx<=Math.floor((p.x+PW-.1)/T);tx++){
   if(row<9&&g[row][tx]==='F'&&!rev['f'+tx]){rev['f'+tx]=1;fl.push({x:tx,y:row,t:.12})}
  }
 }
 for(var i=fl.length-1;i>=0;i--){fl[i].t-=dt;if(fl[i].t<=0){g[fl[i].y][fl[i].x]='.';fl.splice(i,1)}}
 var cx=p.x+PW/2;
 for(var ty=0;ty<9;ty++)for(var x=Math.max(0,Math.floor(p.x/T)-3);x<Math.min(LW,Math.floor(p.x/T)+5);x++){
  var ch=g[ty][x];
  if(ch==='P'){if(Math.abs(cx-(x*T+20))<48)act[x+','+ty]=1;if(act[x+','+ty]&&ov(p.x,p.y,PW,PW,x*T+8,ty*T-28,24,28))kill('pop')}
  else if(ch==='S'&&ov(p.x,p.y,PW,PW,x*T+6,ty*T+22,28,18))kill('spike');
  else if(ch==='C'&&ov(p.x,p.y,PW,PW,x*T+8,ty*T+8,24,24))kill('cheese');
  else if(ch==='E'&&ov(p.x,p.y,PW,PW,x*T+6,ty*T+6,28,28))kill('exit');
  else if(ch==='G'&&ov(p.x,p.y,PW,PW,x*T+6,ty*T+6,28,28)&&st==='play'){beep(880,.3,'triangle');lv++;if(lv>=LV.length){st='win'}else load(lv);return}
 }
 ents.forEach(function(e){
  if(e.k==='Y'){crawl(e,dt,cx);return}
  if(e.k==='Q'){dpop(e,dt,cx);return}
  if(e.k==='U'&&e.s===2){e.t-=dt;if(e.t<=0){e.s=3;g[Math.round(e.y/T)][Math.floor(e.x/T)]='.'}}
  if(e.k==='U'&&e.s===3){e.y-=520*dt;if(ov(p.x,p.y,PW,PW,e.x+2,e.y,36,T))kill('block');if(e.y<=e.y0){e.y=e.y0;e.s=0}}
  if(e.s===0&&Math.abs(cx-(e.x+20))<44&&p.y>e.y)e.s=1;
  if(e.s===1){
   e.vy+=2600*dt;e.y+=e.vy*dt;
   if(ov(p.x,p.y,PW,PW,e.x+2,e.y,36,T))kill('block');
   var ty2=Math.floor((e.y+T)/T);
   if(solid(Math.floor(e.x/T),ty2)){e.y=ty2*T-T;e.s=2;e.t=.9;g[ty2-1][Math.floor(e.x/T)]='#'}
  }
 });
 if(p.y>H+60)kill('pit');
 cam=Math.max(0,Math.min(LW*T-W,p.x-260));
}
function ground(tx,ty,tall){
 var x=tx*T,y=ty*T;
 ctx.fillStyle='#8a5a3b';ctx.fillRect(x,y,T,T*(tall?2:1));
 ctx.fillStyle='#7a4e2f';ctx.fillRect(x+8,y+18,6,6);ctx.fillRect(x+26,y+28,6,6);
 var up=ty>0&&g[ty-1][tx]&&'#PFM'.indexOf(g[ty-1][tx])>=0;
 if(!up){ctx.fillStyle='#5fae4f';ctx.fillRect(x,y,T,8)}
}
function sp(x,y,h){ctx.fillStyle='#b7bcc6';for(var k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+k*8,y);ctx.lineTo(x+k*8+4,y-h);ctx.lineTo(x+k*8+8,y);ctx.fill()}}
function wheel(x,y){
 ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x+20,y+22,17,0,7);ctx.fill();
 ctx.strokeStyle='#e0a800';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#e0a800';ctx.beginPath();ctx.arc(x+14,y+18,3,0,7);ctx.arc(x+25,y+26,3.5,0,7);ctx.arc(x+24,y+14,2,0,7);ctx.fill();
}
function txt(s,x,y,sz,col,al){ctx.font='bold '+sz+'px "Trebuchet MS",Arial,sans-serif';ctx.textAlign=al||'center';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function drawMouse(){
 ctx.save();ctx.translate(p.x+12,p.y+24);ctx.scale(p.f,1);
 var w=p.on?Math.sin(t*26)*Math.abs(p.vx)/220*3:0;
 ctx.strokeStyle='#e7a8b4';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,-8);ctx.quadraticCurveTo(-20,-6+w*2,-23,-18+w);ctx.stroke();
 ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.ellipse(0,-10,13,9,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(11,-11,8,6,0,0,7);ctx.fill();
 ctx.fillStyle='#e7a8b4';ctx.beginPath();ctx.arc(6,-19,6,0,7);ctx.fill();
 ctx.fillStyle='#9aa3b5';ctx.beginPath();ctx.arc(6,-19,3.8,0,7);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(13,-13,1.8,0,7);ctx.fill();
 ctx.fillStyle='#e7a8b4';ctx.beginPath();ctx.arc(18,-11,2.2,0,7);ctx.fill();
 ctx.fillStyle='#7d869a';ctx.fillRect(-6+w,-3,5,3);ctx.fillRect(4-w,-3,5,3);
 ctx.restore();
}
function draw(){
 var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7ec8e3');gr.addColorStop(1,'#d9f0e6');
 ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.8)';
 for(var i=0;i<6;i++){var cx0=((i*260-cam*.3)%1560+1560)%1560-120;ctx.beginPath();ctx.arc(cx0,60+(i%3)*30,22,0,7);ctx.arc(cx0+26,52+(i%3)*30,28,0,7);ctx.arc(cx0+54,62+(i%3)*30,20,0,7);ctx.fill()}
 ctx.save();ctx.translate(-Math.round(cam),0);
 var a=Math.floor(cam/T),b=a+19;
 for(var ty=0;ty<9;ty++)for(var tx=Math.max(0,a);tx<=Math.min(LW-1,b);tx++){
  var ch=g[ty][tx],x=tx*T,y=ty*T;
  if(ch==='#'||ch==='P')ground(tx,ty);
  else if(ch==='F')ground(tx,ty,true);
  else if(ch==='M'&&rev[tx+','+ty]){ground(tx,ty);txt('?',x+20,y+28,22,'#ffd23f')}
  else if(ch==='S'){ctx.fillStyle='#b7bcc6';for(var k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+k*13.3,y+T);ctx.lineTo(x+k*13.3+6.6,y+T-26);ctx.lineTo(x+k*13.3+13.3,y+T);ctx.fill()}}
  else if(ch==='C'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x+4,y+34);ctx.lineTo(x+36,y+34);ctx.lineTo(x+36,y+10);ctx.closePath();ctx.fill();ctx.fillStyle='#e0a800';ctx.beginPath();ctx.arc(x+28,y+28,3,0,7);ctx.arc(x+18,y+31,2.2,0,7);ctx.fill()}
  else if(ch==='E'||ch==='G')wheel(x,y);
  if(ch==='P'&&act[tx+','+ty]){ctx.fillStyle='#b7bcc6';for(k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x+8+k*8,y);ctx.lineTo(x+12+k*8,y-28);ctx.lineTo(x+16+k*8,y);ctx.fill()}}
 }
 ents.forEach(function(e){if(e.k==='Q'){if(e.s===1)sp(e.x+8,e.y,28);if(e.s===3)sp(e.x2+8,e.y,e.t>0?10:28);return}if(e.k==='Y'){ctx.fillStyle='#b7bcc6';for(var q=0;q<3;q++){ctx.beginPath();ctx.moveTo(e.x+4+q*11,e.y+T);ctx.lineTo(e.x+9.5+q*11,e.y+T-26);ctx.lineTo(e.x+15+q*11,e.y+T);ctx.fill()}return}ctx.fillStyle='#6d7380';ctx.fillRect(e.x,e.y,T,T);ctx.strokeStyle='#4e535e';ctx.lineWidth=3;ctx.strokeRect(e.x+1.5,e.y+1.5,T-3,T-3);ctx.beginPath();ctx.moveTo(e.x+8,e.y+10);ctx.lineTo(e.x+20,e.y+22);ctx.lineTo(e.x+14,e.y+32);ctx.stroke()});
 if(st!=='dead')drawMouse();else{ctx.globalAlpha=.5;drawMouse();ctx.globalAlpha=1}
 ctx.restore();
 txt('Level '+(Math.min(lv,LV.length-1)+1)+' of '+LV.length,16,30,20,'#2b1d14','left');
 txt('Deaths '+deaths,W-16,30,20,'#2b1d14','right');
 if(st==='play'&&intro>0)txt(LV[lv].n,W/2,120,34,'#2b1d14');
 if(st==='dead'){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);txt('Oops!',W/2,150,48,'#ff8a7a');txt(msg,W/2,194,22)}
 if(st==='title'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt('Trust No Cheese',W/2,130,48);txt('Reach the cheese wheel. Everything else is a trap.',W/2,172,19,'#ffd23f');txt('Tap Jump to start',W/2,226,26)}
 if(st==='win'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('You escaped!',W/2,130,50,'#ffd23f');txt('Total deaths: '+deaths,W/2,176,26);txt('Tap Jump to play again',W/2,226,24)}
}
var last=performance.now();
function loop(n){
 var dt=Math.min(.033,(n-last)/1000);last=n;
 if(st==='play')update(dt);
 else if(st==='dead'){dT-=dt;if(dT<=0){load(lv);st='play'}}
 draw();requestAnimationFrame(loop);
}
load(0);
requestAnimationFrame(loop);
})();
